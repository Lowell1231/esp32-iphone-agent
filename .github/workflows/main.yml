name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Config File
        run: |
          cd ios/Config
          cp Local.xcconfig.example Local.xcconfig
          sed -i '' 's/YOUR_DEVELOPMENT_TEAM//g' Local.xcconfig
          sed -i '' 's/YOUR_BUNDLE_ID/com.example.agent/g' Local.xcconfig

      - name: Build App
        run: |
          cd ios
          xcodebuild -project IPhoneAgent.xcodeproj -scheme IPhoneAgent -sdk iphoneos -configuration Release -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/IPhoneAgent.app Payload/
          zip -r IPhoneAgent.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: IPhoneAgent.ipa
